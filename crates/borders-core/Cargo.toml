[package]
name = "borders-core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[package.metadata.cargo-machete]
ignored = ["serde_bytes", "chrono"]

[features]
default = ["bevy_debug"]
bevy_debug = ["bevy_ecs/detailed_trace"]

[dependencies]
bevy_ecs = { version = "0.17", default-features = false, features = ["std"] }
flume = "0.11"
futures = "0.3"
futures-lite = "2.6.1"
glam = { version = "0.30", features = ["serde", "rkyv"] }
rkyv = { version = "0.8", features = ["hashbrown-0_15"] }
hex = "0.4"
hmac = "0.12"
image = "0.25"
once_cell = "1.20"
quanta = "0.12"
rand = "0.9"
serde = { version = "1.0", features = ["derive", "rc"] }
slotmap = "1.0"
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"
web-transport = "0.9"
extension-traits = "2.0"

# Target-specific dependencies to keep WASM builds compatible
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "io-util",
    "sync",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "brotli",
    "gzip",
    "deflate",
    "zstd",
] }
hickory-resolver = { version = "0.25", features = [
    "tls-ring",
    "https-ring",
    "quic-ring",
    "h3-ring",
    "webpki-roots",
] }
uuid = { version = "1.11", features = ["v4", "serde"] }
machineid-rs = "1.2"
directories = "6.0"
ring = "0.17.14"
pem = "3.0.6"
sysinfo = "0.37"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
    "BroadcastChannel",
    "MessageEvent",
    "Navigator",
    "Window",
] }

[dev-dependencies]
assert2 = "0.3"
criterion = { version = "0.7", features = ["html_reports"] }
rstest = "0.23"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "game_benchmarks"
harness = false

[build-dependencies]
chrono = "0.4"
